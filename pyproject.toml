[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mcp-legislacao-br"
version = "0.1.0"
description = "Servidor MCP para consultar legislação federal brasileira em fontes oficiais (Planalto, Câmara e Senado), com conferência de vigência por artigo."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hudson Travassos" }]
requires-python = ">=3.10"
keywords = ["mcp", "legislacao", "planalto", "camara", "senado", "direito", "brasil", "lexml"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: Portuguese (Brazilian)",
  "Topic :: Text Processing :: Markup :: HTML",
  "Intended Audience :: Legal Industry",
]
dependencies = [
  "mcp>=1.2",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
mcp-legislacao-br = "mcp_legislacao_br.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_legislacao_br"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.urls]
Repository = "https://github.com/wall-e-assessor/mcp-legislacao-br"
Issues = "https://github.com/wall-e-assessor/mcp-legislacao-br/issues"
